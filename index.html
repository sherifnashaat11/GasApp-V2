<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>محلل التجزئة</title>
    
    <!-- ربط ملف المانيفست -->
    <link rel="manifest" href="manifest.json">
    <!-- لون شريط الحالة في الموبايل -->
    <meta name="theme-color" content="#4CAF50">
    
    <script>
        // تسجيل الـ Service Worker
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("./sw.js")
                    .then(reg => console.log("تم تسجيل الـ Service Worker بنجاح!"))
                    .catch(err => console.log("خطأ في تسجيل الـ Service Worker:", err));
            });
        }

        // التحويل لصفحة الكوليكتور
        window.location.href = "collector/index.html";
    </script>
</head>
<body>
    <p style="text-align:center; margin-top:50px; font-family:sans-serif;">جاري تحميل التطبيق...</p>
</body>
</html>
