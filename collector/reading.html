<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قراءة العداد</title>
<link rel="stylesheet" href="style.css">
<script src="dexie.min.js"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { min-height: 0; }
  .rd { display: flex; flex-direction: column; height: 100dvh; max-width: 420px; margin: 0 auto; padding: 14px; gap: 10px; }
  .rd-head { text-align: center; }
  .rd-head h1 { font-size: 1.15rem; color: var(--primary); font-weight: 800; }
  .rd-head p { font-size: .85rem; color: var(--mute); margin-top: 4px; line-height: 1.5; }
  .rd-body { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 6px; }
  .rd-box { background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px; }
  .meta-row { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; }
  .meta-row .v-prev { color: var(--primary); }
  .meta-row .v-due { color: var(--danger); }
  .rd label { display: block; font-weight: 800; font-size: .9rem; margin-bottom: 6px; }
  .rd input { width: 100%; padding: 12px; border: 2px solid var(--line); border-radius: 10px; font-size: 1.6rem; font-weight: 800; text-align: center; color: var(--primary); background: var(--bg); direction: ltr; font-family: inherit; }
  .rd input:focus { outline: none; border-color: var(--primary); }
  .calc-row { display: flex; justify-content: space-between; font-size: 14px; font-weight: 800; margin-bottom: 6px; }
  .calc-row.total { font-size: 18px; color: var(--success); border-top: 1px dashed var(--line); padding-top: 8px; margin-top: 4px; }
  .words { font-size: 12px; color: var(--mute); margin-top: 4px; line-height: 1.6; }
  .tbl-wrap { overflow-x: auto; margin-top: 6px; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th, .tbl td { border: 1px solid var(--line); padding: 6px 4px; text-align: center; }
  .tbl th { background: var(--bg); font-weight: 800; }
  .tbl td.sub { color: var(--mute); font-size: 11.5px; text-align: right; }
  .rd-actions { display: flex; flex-direction: column; gap: 8px; }
  .rd-actions button { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 1.05rem; font-weight: 800; cursor: pointer; }
  #saveBtn { background: var(--primary); color: var(--primary-ink); }
  #saveBtn:disabled { opacity: .5; }
  #cancelBtn { background: transparent; color: var(--mute); border: 2px solid var(--line); }
  .err { color: var(--danger); font-size: 13px; font-weight: 800; min-height: 18px; text-align: center; }
</style>
</head>
<body data-theme="light">
<div class="rd">
  <div class="rd-head">
    <h1>قراءة العداد</h1>
    <p id="clientInfo">جاري التحميل...</p>
  </div>

  <div class="rd-body">
    <div class="rd-box">
      <div class="meta-row">
        <span>القراءة السابقة: <span id="prevReadDisplay" class="v-prev">0</span></span>
        <span>أشهر المحاسبة: <span id="monthsDisplay" class="v-prev">1</span></span>
        <span>المديونية: <span id="dueDisplay" class="v-due">0</span> ج</span>
      </div>
    </div>

    <div class="rd-box">
      <label for="v">القراءة الحالية (حد أقصى 5 أرقام)</label>
      <input id="v" type="number" inputmode="numeric" autocomplete="off" placeholder="00000">
      <div class="err" id="err"></div>
    </div>

    <div class="rd-box">
      <div class="calc-row"><span>الاستهلاك:</span><span id="consumptionVal">0 م³</span></div>
      <div class="calc-row"><span>المتوسط الشهري:</span><span id="avgVal">0 م³</span></div>
      <div class="tbl-wrap" id="breakdown"></div>
      <div class="calc-row" style="margin-top:8px"><span>الرسوم (مرة واحدة):</span><span id="feesVal">0 ج.م</span></div>
      <div class="calc-row total"><span>الفاتورة القادمة (تقديرية):</span><span id="invoiceVal">0 ج.م</span></div>
      <div class="words" id="wordsVal"></div>
    </div>
  </div>

  <div class="rd-actions">
    <button id="saveBtn">حفظ القراءة</button>
    <button id="cancelBtn">إلغاء</button>
  </div>
</div>

<script type="module">
  import { db, initDb, calcNextInvoice, recordReading, getReadingForPeriod, getCurrentPeriod } from '../shared/db.js';

  const $ = (id) => document.getElementById(id);
  const p = new URLSearchParams(location.search);
  const key = p.get('k');
  const period = getCurrentPeriod();            // لا فترة ثابتة
  let prevReading = Number(p.get('p')) || 0;
  let months = Number(p.get('m')) || 1;
  let last = null;                               // آخر حساب

  /* ---- مزامنة الثيم مع الصفحة الأم ---- */
  const syncTheme = () => document.body.setAttribute('data-theme', localStorage.getItem('app-theme') || 'light');
  syncTheme();
  window.addEventListener('storage', (e) => { if (e.key === 'app-theme') syncTheme(); });
  window.addEventListener('message', (e) => { if (e.data && e.data.type === 'THEME') syncTheme(); });

  const fmt = (n) => Number(n).toLocaleString('en-US', { maximumFractionDigits: 2 });
  const post = (type) => {
    if (window.parent && window.parent !== window) window.parent.postMessage({ type }, '*');
    else window.close();
  };

  $('clientInfo').innerHTML = '';
  const b = document.createElement('b'); b.textContent = p.get('n') || 'بدون اسم';
  $('clientInfo').append(b, document.createElement('br'), document.createTextNode(p.get('a') || ''));

  function render(reading) {
    const inv = calcNextInvoice({ reading, prevReading, months, period });
    last = inv;
    $('consumptionVal').textContent = `${fmt(inv.cons)} م³`;
    $('avgVal').textContent = `${fmt(inv.avg)} م³`;
    $('feesVal').textContent = `${fmt(inv.fees)} ج.م`;
    $('invoiceVal').textContent = `${fmt(inv.grandTotal)} ج.م`;
    $('wordsVal').textContent = inv.cons > 0 || reading ? `${inv.words} جنيهاً مصرياً فقط لا غير` : '';

    // تفصيل شهري
    const rows = inv.rows.map(r => {
      const detail = r.tiers.map(t => `${t.name}: ${fmt(t.qty)}×${fmt(t.price)}`).join(' + ') || '—';
      return `<tr><td>${r.month}</td><td class="sub">${detail}</td><td>${fmt(r.cost)}</td></tr>`;
    }).join('');
    $('breakdown').innerHTML = `<table class="tbl"><thead><tr><th>الشهر</th><th>الشرائح</th><th>التكلفة</th></tr></thead><tbody>${rows}</tbody></table>`;
    return inv;
  }

  async function init() {
    if (!key) { $('err').textContent = 'خطأ: لم يتم تمرير كود العميل'; $('saveBtn').disabled = true; return; }
    await initDb();
    const sub = await db.subscribers.get(key);
    if (sub) {
      if (!p.has('p')) prevReading = Number(sub.prevReading) || 0;
      if (!p.has('m')) months = Number(sub.months) || 1;
      $('dueDisplay').textContent = fmt(Number(sub.dueAmount) || 0);
      if (!p.has('n')) $('clientInfo').textContent = sub.name || '';
    }
    $('prevReadDisplay').textContent = prevReading;
    $('monthsDisplay').textContent = months;

    const existing = await getReadingForPeriod(key, period);   // قراءة فعلية فقط (لا سداد)
    if (existing && existing.reading !== undefined) {
      $('v').value = existing.reading;
      render(existing.reading);
    } else {
      render(0);
    }
    $('v').focus();
  }

  $('v').addEventListener('input', function () {
    if (this.value.length > 5) this.value = this.value.slice(0, 5);
    $('err').textContent = '';
    render(Number(this.value) || 0);
  });

  $('saveBtn').onclick = async () => {
    const raw = $('v').value;
    const val = Number(raw);
    if (raw === '' || Number.isNaN(val)) { $('err').textContent = '⚠️ أدخل القراءة الحالية'; return; }
    if (val < prevReading) { $('err').textContent = '⚠️ القراءة الحالية يجب أن تكون أكبر من أو تساوي السابقة'; return; }
    $('saveBtn').disabled = true;
    try {
      const inv = render(val);
      await recordReading({
        key, reading: val, prevReading, consumption: inv.cons,
        estimatedInvoice: inv.grandTotal, months, period,
        invoice: { rows: inv.rows, fees: inv.fees, grandTotal: inv.grandTotal, words: inv.words, avg: inv.avg }
      });
      post('READING_SAVED');
    } catch (err) {
      $('err').textContent = 'خطأ: ' + err.message;
      $('saveBtn').disabled = false;
    }
  };

  $('cancelBtn').onclick = () => post('READING_CANCEL');

  init();
</script>
</body>
</html>
